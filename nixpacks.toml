# Konfigurasi build & start untuk Railway (Nixpacks) — KELAM (Laravel + PostgreSQL)
# Railway akan menjalankan build lalu start. Migrasi dijalankan saat start
# supaya database (plugin PostgreSQL Railway) sudah tersedia.

[phases.setup]
nixPkgs = ["php84", "php84Packages.composer", "nodejs_20"]

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader --no-interaction",
]

[phases.build]
cmds = [
  "php artisan config:cache",
  "php artisan route:cache",
  "php artisan view:cache",
]

[start]
# Jalankan migrasi (tanpa seed produk agar tidak menimpa data) lalu serve.
# Untuk seed awal di production, jalankan sekali manual: php artisan db:seed --force
cmd = "php artisan migrate --force && php artisan serve --host 0.0.0.0 --port ${PORT:-8080}"
