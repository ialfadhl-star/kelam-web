# Build & start untuk Railway (Nixpacks) — KELAM (Laravel + PostgreSQL, TANPA Node/Vite).
#
# Demo ini tidak memakai Vite/npm sama sekali: CSS & JS adalah file statis di
# public/css & public/js yang sudah di-commit. Karena itu build cukup Composer
# saja — tidak ada `npm install`/`npm run build` (yang sebelumnya bikin builder
# OOM / exit 137).
#
# PIN VERSI PHP: Nixpacks memilih versi PHP dari constraint composer.json
# "require": { "php": "^8.4" } — inilah mekanisme resmi Nixpacks untuk PHP
# (berbeda dari Node yang pakai NIXPACKS_NODE_VERSION; PHP tidak punya env var
# versi terpisah, jadi composer.json yang menentukan). Karena "^8.4" tidak
# dipenuhi oleh 8.3, builder wajib memakai 8.4.x — bukan lagi default 8.3.
# composer.json juga meng-set config.platform.php = 8.4.25 supaya resolusi
# Composer eksplisit menargetkan 8.4. Ekstensi pdo_pgsql diaktifkan lewat
# require "ext-pdo_pgsql".

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist",
]

# Tidak ada [phases.build]: tidak perlu compile aset. Cache config/route/view
# dijalankan saat start (bukan build) supaya env var Railway sudah tersedia.

[start]
cmd = "php artisan migrate --force && php artisan optimize && php artisan serve --host 0.0.0.0 --port ${PORT:-8080}"
